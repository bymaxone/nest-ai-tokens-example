# Local demo infrastructure for nest-ai-tokens-example.
#
# A single Postgres service backs the Prisma data layer; the library itself
# needs no other infrastructure (no Redis, no message broker). Credentials are
# local-only defaults for a developer machine or a CI runner, never production
# values. The image is pinned by digest so local and CI runs are reproducible;
# Renovate proposes digest bumps.
services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ai_tokens_example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Bound to loopback so the database is never exposed on the LAN.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_tokens_example']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
