# CI: thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic gates (install, lint, typecheck, format, unit coverage, web
# build) live in bymaxone/.github so every repo shares one definition; the
# shared setup action clones and builds the sibling library beside the
# workspace so the `file:` dependency resolves. Web unit coverage folds into
# the reusable's own "unit" job through the root `test:cov` script (no
# separate "web-test" job exists in the reusable); web verification is the
# web-build job plus the Vitest integration suite (no Playwright layer, so
# the reusable's web-e2e stage stays off). The export audit runs through the
# reusable's export-usage job (`pnpm audit:exports`: the gate's node:test
# proof, then the audit itself). The reusable's job names are the CI
# contract for branch protection.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same ref so only the latest commit is verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-ci.yml@v1
    with:
      library-repo: bymaxone/nest-ai-tokens
      has-web: true
      # No Playwright layer by design; the web-build job plus the Vitest
      # integration suite prove the production Next.js surface stays green.
      run-e2e-web: false
      # Library export audit: every real dist export must be imported by the
      # apps or ⛔-justified in the spec's coverage matrix (spec §7.7).
      run-export-audit: true
      # The reusable's e2e-api job runs on the runner's Docker daemon via
      # Testcontainers (random mapped ports), so no `services:` block and no
      # fixed host port are involved; the suite provisions its own Postgres.
      run-e2e-api: true
      e2e-api-command: pnpm --filter api run test:e2e
      # Credential-free placeholder: the Prisma config resolves DATABASE_URL at
      # load time (generate/lint/typecheck); the e2e suite overrides it with
      # the Testcontainers connection URI at runtime.
      database-url: postgresql://localhost:5432/ai_tokens_example
      post-install: pnpm --filter api run prisma:generate

  # Repo-specific gate: apps/web must import ONLY the library's browser-safe
  # shared subpath, never the server root. The reusable has no such input.
  web-import-guard:
    name: Web shared-subpath import guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fail on any server-subpath import inside apps/web
        run: |
          if grep -rn "@bymax-one/nest-ai-tokens" apps/web --include='*.ts' --include='*.tsx' \
              | grep -vE "@bymax-one/nest-ai-tokens/shared['\"/]"; then
            echo "apps/web must import only the '/shared' subpath." >&2
            exit 1
          fi

  # Repo-specific gate: the API production build (the reusable only builds
  # web apps; this repo ships an API whose compile must stay green).
  build:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same credential-free placeholder as above: prisma generate reads the
      # config at load time; nothing connects.
      DATABASE_URL: postgresql://localhost:5432/ai_tokens_example
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node + pnpm and the linked library
        uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          library-repo: bymaxone/nest-ai-tokens
          post-install: pnpm --filter api run prisma:generate

      - name: Build the API
        run: pnpm --filter api run build

  # Repo-specific gate: prove both published subpaths of the linked library
  # (`.` and `./shared`) resolve through its real exports map under Node ESM.
  probe:
    name: Library subpath probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node + pnpm and the linked library
        uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          library-repo: bymaxone/nest-ai-tokens

      - name: Probe the published subpaths
        run: node scripts/probe-subpaths.mjs

  security:
    # Dependency review needs the dependency graph, which is only available on
    # public repos (or private + GitHub Advanced Security). Gated on visibility
    # so it starts running automatically once this repo is made public.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high

  # Single check the org ruleset can require, in every repo, under one name.
  #
  # A required status check is matched by literal name, and this repo's jobs are
  # named nothing like the next repo's — so there is no list of contexts that
  # works org-wide. One aggregate per repo, always spelled `CI passed`, is what
  # makes a single rule at the organisation level possible, and what makes every
  # repository created from now on inherit the gate without being configured.
  #
  # `always()` is what makes this a gate rather than decoration: without it the
  # job is skipped the moment a dependency fails, and a skipped check reports
  # neutral — the pull request would look unblocked precisely when it is broken.
  # `cancelled` is named explicitly for the same reason; a cancelled job is not
  # a passing one, and a queue timeout produces exactly that.
  #
  # A skipped dependency is accepted on purpose: jobs here are conditional on the
  # event, and failing on skip would break every push that legitimately runs a
  # subset.
  ci-pass:
    name: CI passed
    if: always()
    needs: [ci, web-import-guard, build, probe, security]
    runs-on: ubuntu-latest
    # Once this is the required check, a hung runner holds every merge behind it
    # for GitHub's default of six hours. The job is one comparison, so a short
    # ceiling costs nothing and bounds that.
    timeout-minutes: 5
    steps:
      # Printed on success as well as failure. Without it the check reports a bare
      # red X and the reader has to open each dependency to find which one broke.
      - name: Report the result of every dependency
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Named for what the condition does: `skipped` is deliberately not a failure
      # here, so "did not succeed" would describe a stricter gate than this is.
      - name: Fail when any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
