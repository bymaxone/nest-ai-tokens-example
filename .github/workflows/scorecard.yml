# OpenSSF Scorecard: measures supply-chain security best practices. Guarded by a
# visibility check so it runs only once the repository is public; while private
# it reports as skipped, not failed, and activates automatically on the
# visibility flip with zero workflow edits.
#
# The check asks the API rather than reading `github.event.repository.private`.
# This workflow also runs on a schedule, and the event payload is not the same
# shape on every trigger; one API call answers identically on all of them.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly on Sunday 04:00 UTC, offset from CodeQL to avoid resource contention.
    - cron: '0 4 * * 0'

permissions:
  contents: read

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The assignment sits inside `if`, which `set -e` does not act on, so
          # the retry works without disabling error checking for the rest of the
          # step — a failed write to $GITHUB_OUTPUT must still fail the job.
          visibility=""
          for attempt in 1 2 3; do
            if visibility=$(gh api "repos/$REPO" --jq .visibility 2>/dev/null); then
              break
            fi
            visibility=""
            if [ "$attempt" -lt 3 ]; then
              sleep $(( attempt * 5 ))
            fi
          done

          if [ -z "$visibility" ]; then
            # Degraded rather than failed: a red workflow over a transient API
            # error is noise, and the warning keeps it from being silent.
            echo "::warning::Could not determine repository visibility after 3 attempts; treating it as non-public and skipping."
            echo "public=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            # Covers internal as well as private.
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped on a $visibility repository: uploading results needs a GitHub Code Security licence, which is only free on public repositories."
          fi


  scorecard:
    name: OpenSSF Scorecard
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history required for branch-protection and commit-signing checks.
          fetch-depth: 0

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Publish Scorecard results to the Security tab
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: results.sarif
