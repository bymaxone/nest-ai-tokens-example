# CodeQL static analysis for JavaScript/TypeScript. Guarded by a visibility check
# so it runs only once the repository is public: while private it reports as
# skipped, not failed, and activates automatically on the visibility flip with
# zero workflow edits.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly on Sunday 03:00 UTC, to catch newly published CVEs.
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: '/language:javascript-typescript'
